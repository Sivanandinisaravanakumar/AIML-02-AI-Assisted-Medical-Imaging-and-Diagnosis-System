services:
  orthanc:                       # DICOM server (PACS)
    image: jodogne/orthanc
    ports:
      - "8042:8042"              # web UI / REST  -> http://localhost:8042
      - "4242:4242"              # DICOM protocol
    environment:
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__AUTHENTICATION_ENABLED: "false"
    volumes:
      - orthanc-data:/var/lib/orthanc/db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ORTHANC_URL: http://orthanc:8042
      MODEL_PATH: /app/models/model.pth
      STORAGE_DIR: /app/storage
    volumes:
      - ./models:/app/models
      - ./storage:/app/storage
    depends_on:
      - orthanc

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  orthanc-data:
